name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

jobs:
  unit:
    name: Unit (just check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy

      # Prebuilt `just`; version pinned so CI matches local recipes.
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.58.0

      - run: just check

      # Same pinned release and checksum as tests/docker/Dockerfile.
      - name: Install shpool
        env:
          SHPOOL_VERSION: 0.11.5
          SHPOOL_SHA256: 132f786bd275749a46224c17a071474a850f0be1fbb752b1c96d910778543c9b
        run: |
          curl -fsSL -o /tmp/shpool.tar.gz \
            "https://github.com/shell-pool/shpool/releases/download/v${SHPOOL_VERSION}/shpool-x86_64-unknown-linux-musl.tar.gz"
          echo "${SHPOOL_SHA256}  /tmp/shpool.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/shpool.tar.gz -C "$HOME/.local/bin" shpool
          echo "SHPOOL_BIN=$HOME/.local/bin/shpool" >> "$GITHUB_ENV"

      - run: just check-mux

  integration:
    name: Integration (headless Sway + sshd containers)
    runs-on: ubuntu-latest
    env:
      # Runners ship Docker with the compose v2 plugin, not podman.
      COMPOSE: docker compose
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-unknown-linux-musl

      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.58.0

      - run: just check-int -- --nocapture

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-failures
          path: tests/test-output/failures/
          if-no-files-found: ignore

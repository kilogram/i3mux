[package]
name = "i3mux"
version = "0.1.0"
edition = "2021"
# std::fs::File::lock (the state-file flock) needs 1.89.
rust-version = "1.89"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shell-words = "1.1"
thiserror = "2.0"

[dev-dependencies]
proptest = "1.5"
regex = "1.10"
tempfile = "3.8"
# Used by the container integration suite under tests/.
chrono = "0.4"
image = "0.25"
toml = "0.8"
testcontainers = { version = "0.23", features = ["blocking", "watchdog"] }
rstest = "0.22"
# pty for the ignored shpool tests in src/mux_pty_tests.rs (`just check-mux`).
nix = { version = "0.31", default-features = false, features = ["term"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Tests may unwrap; see clippy.toml.
unwrap_used = "deny"
expect_used = "deny"
